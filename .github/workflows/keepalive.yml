name: Keep scheduled workflows active

on:
  schedule:
    - cron: "23 12 1,16 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset scheduled workflow inactivity timers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml keepalive.yml; do
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done
